            const logoAdatbazis = {

                "DEBRECENI HOKI KLUB": "DHK", "DHK": "DHK",
                "DÉL- BUDAI HOCKEY CLUB": "PHC", "DÉL-BUDAI HOCKEY CLUB": "PHC", 
                "DSC-SI": "DSC", "DEBRECENI SPORTISKOLA": "DSC",
                "DUNAÚJVÁROSI ACÉLBIKÁK": "DAB", "DAB": "DAB", "DUNAÚJVÁROSI JÉGTÖRŐK": "DAB",
                "DVTK JEGESMEDVÉK": "DVTK", "EGERSTARS EGRI VÁROSI SPORTISKOLA": "EGERSTARS",
                "EGERSZEGI TITÁNOK": "ETIT", "EGRI VÁROSI SPORTISKOLA": "EGER", "ESMTK": "ESMTK",
                "FTC-TELEKOM": "FTC", "FTC": "FTC",
                "GOODWILL PHARMA SZEGED": "SZEG", "GOODWILL PHARMA SZEGEDI VÍZMŰ": "SZEG",
                "GÖDÖLLŐI MUSKÉTÁSOK": "GODM",
                "HATVANI GIGÁSZOK": "FCH", "FC HATVAN GIGÁSZAI": "FCH",
                "HC KISKŐRÖS": "KISK",
                "HK SPARTAK SUBOTICA": "HKS", "HK SPARTAK": "HKS",
                "HKB": "HKB", "HKB HURRICANES": "HKB", "KMH SE": "HKB",
                "IFJ. OCSKAY GÁBOR JA": "IOGJA", "IOGJA": "IOGJA",
                "JÉGKERT SE": "JSE", "JÉGOROSZLÁNOK": "JÉGO", "KALÓZOK HOKI KLUB": "KAL",
                "KÁRPÁTI FARKASOK": "KF", "KASI": "KASI", "KASI USE": "KASI",
                "KAZINCBARCIKAI ÖRDÖGÖK": "KAZ", "KESI": "KESI", "KŐSZEGI FARKASOK": "KOSZF",
                "KSI": "KSI", "LEHEL HC": "LEH", "LIZARDS": "LIZ",
                "MAC BUDAPEST A": "MAC", "MAGYAR JÉGKORONG SZÖVETSÉG": "MJSZ",
                "MAROSI PENGÉK": "MPEN", "MEGYERI PINGVINEK": "MEGYERI",
                "MOSONMAGYARÓVÁRI JÉGSÁRKÁNYOK": "MJ", "NS STARS": "NS",
                "NYÍREGYHÁZI SPORTCENTRUM": "NYÍR", "NYÍREGYHÁZI SC": "NYÍR",
                "NYUGATI ESZKIMÓK": "NYE", "OHA": "OHA", "ÓVÁRI JÉGSÁRKÁNYOK": "JEGS",
                "PÉCSI SAKÁLOK": "PSAK", "PÉCSI SPORTISKOLA": "PECS",
                "POLIPKÁK": "POL", "TATABÁNYAI POLIPOK": "POL", "POLIPOK MINI": "POL",

                "SPORTORSZÁGI CÁPÁK": "SPO", "SZABOLCSI SÓLYMOK": "SZAB",
                "SZARVASI JÉGKORONG SE": "SZARV", "SZEKSZÁRDI JÉGMADARAK": "SZJ",
                "SZENT ISTVÁN SPORTISKOLA": "SZIS", "SZENT ISTVÁN SPORTISKOLA HATVAN": "SZIS",
                "SZIGETI BIKÁK PESTERZSÉBET": "SZB", "SZOLNOK ORCAS HOCKEY SE": "ORC",
                "SZOMBATHELYI PINGVINEK": "SZP", "TATAI HÓDOK": "TATAI", "TÁTI TIGRISEK": "TÁTIT",
                "UNI GYŐR ETO HC": "GYŐR", "UTE": "UTE", "VÁROSGAZDA": "VRSG",
                "VASAS SC": "VAS", "VESZPRÉMI JÉGLOVAGOK": "VESZP",
                "VSD PÁRDUCOK": "VSD", "VUA PANDÁK": "VUA",
                "WHITE SHARKS HC": "WSHC", "ZEMPLÉNI HIÚZOK": "ZEMP"
            };

            const getLogoName = (teamName) => {
                if (!teamName) return null;
                let upper = teamName.trim().toUpperCase();
                if (logoAdatbazis[upper]) return logoAdatbazis[upper];
                let clean = upper.replace(/(\s*\d+|\s+[A-Z]\d*|\s+II|\s+III|\s+IV)$/i, '').trim();
                if (logoAdatbazis[clean]) return logoAdatbazis[clean];
                return null;
            };

            const areSameClub = (teamA, teamB) => {
                if (!teamA || !teamB) return false;
                let a = teamA.trim().toUpperCase();
                let b = teamB.trim().toUpperCase();
                if (a === 'SZABAD' || b === 'SZABAD' || a === '' || b === '') return false;
                
                // Tisztító képlet: levágjuk a sorszámokat, betűjeleket (A1, B, II stb.)
                const clean = (s) => s.replace(/(\s*\d+|\s+[A-Z]\d*|\s+II|\s+III|\s+IV)$/i, '').trim();
                let cleanA = clean(a);
                let cleanB = clean(b);
                
                // 1. Sima név egyezés (pl. MAC A1 vs MAC B2 -> mindkettő "MAC")
                if (cleanA === cleanB && cleanA.length > 2) return true;

                // 2. Rejtett testvérek vagy Logó kódok alapján
                const logoA = getLogoName(a) || cleanA;
                const logoB = getLogoName(b) || cleanB;
                
                for (let pair of rejtettTestverek) {
                    // Biztosítjuk, hogy a tömb elemei nagybetűsek legyenek az összehasonlításhoz
                    const upperPair = pair.map(p => p.toUpperCase());
                    if ((upperPair.includes(logoA) && upperPair.includes(logoB)) || 
                        (upperPair.includes(cleanA) && upperPair.includes(cleanB)) ||
                        (upperPair.includes(a) && upperPair.includes(b))) {
                        return true;
                    }
                }
                
                return false;
            };

            const formatDatum = (dateStr) => {
                if (!dateStr) return '';
                const dateObj = new Date(dateStr);
                if (isNaN(dateObj)) return dateStr;
                const napok = ['vasárnap', 'hétfő', 'kedd', 'szerda', 'csütörtök', 'péntek', 'szombat'];
                return `${dateObj.getFullYear()}.${String(dateObj.getMonth() + 1).padStart(2, '0')}.${String(dateObj.getDate()).padStart(2, '0')}. ${napok[dateObj.getDay()]}`;
            };

// ✂️ ------------------------------------------- ✂️

            // ✂️ --- 2. BLOKK HELYE: SORSOLÁSI LOGIKA ÉS MOTOR --- ✂️

            // 1. Állapotok (Memória) inicializálása
            const [tornaAdatok, setTornaAdatok] = useState({
                korosztaly: 'U10', csoport: 'A',
                szint: '4cs_4m_2p_side', sorszam: '',
                datum: '', kezdes: '',
                rendezo: '', helyszin: '',
                info: '', infoSzin: '#dc2626', palyaTipus: '2_palya',
                egyediBemelegitesPerc: '',
                egyediMeccsPerc: '', 
                egyediSzunetPerc: ''
            });

            const [csapatok, setCsapatok] = useState(['', '', '', '', '', '', '', '']);
            const [csapatSzinek, setCsapatSzinek] = useState(Array(8).fill('#1e293b')); // ÚJ: Minden csapat alapból sötétkék/fekete
            const [pastedData, setPastedData] = useState(''); 
            const [utkozesEngedelyezve, setUtkozesEngedelyezve] = useState(false); 
            const fileInputRef = useRef(null);
            
            // --- ÚJ: CSAPATCSERE ÉS KONKRÉT MECCS FELÜLÍRÁS MEMÓRIÁJA ---
            const [kivalasztottCsapat, setKivalasztottCsapat] = useState(null);
            const [manualOverrides, setManualOverrides] = useState({});
	    const [isJSONLoading, setIsJSONLoading] = useState(false);

            // --- SEGÉDFUNKCIÓ: ÉKEZETMENTESÍTÉS A FÁJLNEVEKHEZ ---
            const cleanFileName = (text) => {
                const ekezetek = {'á':'a','é':'e','í':'i','ó':'o','ö':'o','ő':'o','ú':'u','ü':'u','ű':'u','Á':'A','É':'E','Í':'I','Ó':'O','Ö':'O','Ő':'O','Ú':'U','Ü':'U','Ű':'U'};
                let clean = text.split('').map(char => ekezetek[char] || char).join('');
                return clean.replace(/[^a-z0-9]/gi, '_').replace(/_+/g, '_').replace(/^_|_$/g, '');
            };

            // --- A REFORMÁLT RADAR (Ez váltja a régit!) ---
            useEffect(() => {
                // Ha JSON betöltés van folyamatban, a Radar megáll és nem nyúl semmihez
                if (isJSONLoading) return;

                // Ha nem JSON töltődik (hanem pl. beillesztettél), akkor mehet az automatika
                const ujSzint = autoSelectTemplate(tornaAdatok, csapatok);
                if (ujSzint !== tornaAdatok.szint) {
                    setTornaAdatok(prev => ({ ...prev, szint: ujSzint }));
                }
                
                setUtkozesEngedelyezve(false);
                setKivalasztottCsapat(null);
            }, [csapatok, tornaAdatok.korosztaly, tornaAdatok.csoport, isJSONLoading]);
// --- KÖZPONTI INTELLIGENCIA: AUTOMATIKUS SABLONVÁLASZTÓ MOTOR ---
            const autoSelectTemplate = (currentAdatok, currentCsapatok, forceText = null) => {
                const talaltCsapatokSzama = currentCsapatok.filter(c => c && c.trim() !== '' && c !== 'SZABAD').length;
                const searchStr = (forceText || currentAdatok.helyszin + " " + currentAdatok.info).toUpperCase();
                const u8 = currentAdatok.korosztaly === 'U8';
                const isC = currentAdatok.csoport === 'C';

                let overridePalya = 0;
                if (searchStr.includes("4 PÁLY") || searchStr.includes("4P")) overridePalya = 4;
                else if (searchStr.includes("3 PÁLY") || searchStr.includes("3P")) overridePalya = 3;
                else if (searchStr.includes("2 PÁLY") || searchStr.includes("2P")) overridePalya = 2;
                else if (searchStr.includes("KISPÁLYA") || searchStr.includes("1 PÁLY") || searchStr.includes("1P")) overridePalya = 1;

                let maxPalya = 4;
                if (overridePalya === 0) {
                    for (let entry of csarnokAdatbazis) {
                        if (entry.kulcsszavak.some(k => searchStr.includes(k.toUpperCase()))) {
                            maxPalya = entry.kapacitas;
                            break;
                        }
                    }
                }

                let celtPalya = 0; let elrendezes = '';
                if (u8) {
                    if (maxPalya === 1 || overridePalya === 1) { celtPalya = 1; } 
                    else if (maxPalya === 2 || overridePalya === 2) { celtPalya = 2; elrendezes = '_side'; } 
                    else {
                        celtPalya = overridePalya > 0 ? overridePalya : (talaltCsapatokSzama >= 8 ? 4 : (talaltCsapatokSzama >= 6 ? 3 : 2));
                        if (celtPalya === 2) elrendezes = '_stack';
                        if (celtPalya === 3) elrendezes = '_mixed';
                        if (celtPalya === 4) elrendezes = '_grid';
                    }
                } else {
                    if (maxPalya === 1 || overridePalya === 1) { celtPalya = 1; } 
                    else { celtPalya = overridePalya > 0 ? overridePalya : 2; elrendezes = '_side'; }
                }

                if (talaltCsapatokSzama <= 3) { celtPalya = 1; elrendezes = ''; }
                let meccsSzam = isC ? '3m' : '4m';
                let baseSzint = `${talaltCsapatokSzama}cs_${meccsSzam}_${celtPalya}p${elrendezes}`;

                if (!sablonAdatbazis[baseSzint]) {
                    if (celtPalya === 1) baseSzint = isC ? '4cs_3m_1p' : '4cs_4m_1p';
                    else baseSzint = '4cs_4m_2p_side';
                }
                return baseSzint;
            };

            // --- ADATOK MENTÉSE ÉS BETÖLTÉSE (EGYBEFÜGGŐ, JAVÍTOTT BLOKK) ---

            const handleSaveJSON = () => {
                const dataToSave = { tornaAdatok, csapatok, csapatSzinek, manualOverrides };
                const jsonStr = JSON.stringify(dataToSave, null, 2);
                const blob = new Blob([jsonStr], { type: "application/json;charset=utf-8" });
                const url = URL.createObjectURL(blob);
                const rawName = `${tornaAdatok.sorszam}_${tornaAdatok.rendezo}`;
                const safeName = cleanFileName(rawName) || 'sorsolas';
                const a = document.createElement("a");
                a.href = url; a.download = `${safeName}.json`; a.click();
                URL.revokeObjectURL(url);
            };

            const handleLoadJSON = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        setIsJSONLoading(true); // VÉDELEM BE
                        
                        setManualOverrides({}); 
                        setCsapatSzinek(Array(8).fill('#1e293b'));
                        setCsapatok(['', '', '', '', '', '', '', '']);
                        
                        if (data.csapatok) setCsapatok(data.csapatok);
                        if (data.csapatSzinek) setCsapatSzinek(data.csapatSzinek);
                        if (data.tornaAdatok) setTornaAdatok(data.tornaAdatok);
                        
                        setTimeout(() => {
                            if (data.manualOverrides) setManualOverrides(data.manualOverrides);
                            setIsJSONLoading(false); // VÉDELEM KI
                        }, 150);
                    } catch (err) { 
                        setIsJSONLoading(false);
                        alert("Hiba a fájl beolvasásakor!"); 
                    }
                };
                reader.readAsText(file); e.target.value = null;
            };

            // --- OKOS PDF NYOMTATÁS ---
            const handleSmartPrint = () => {
                const originalTitle = document.title;
                const safeName = `${tornaAdatok.sorszam}_${tornaAdatok.rendezo}`.replace(/[^a-z0-9 \-]/gi, '').trim();
                if (safeName) document.title = safeName;
                window.print();
                setTimeout(() => { document.title = originalTitle; }, 1000);
            };

            // --- CSAPATCSERE FUNKCIÓK ---
            
            // 1. Bal oldali lista cseréje (Minden meccsre hat)
            const handleTeamClick = (index) => {
                if (kivalasztottCsapat === null) {
                    setKivalasztottCsapat(index);
                } else {
                    if (kivalasztottCsapat !== index) {
                        const ujCsapatok = [...csapatok];
                        const temp = ujCsapatok[kivalasztottCsapat];
                        ujCsapatok[kivalasztottCsapat] = ujCsapatok[index];
                        ujCsapatok[index] = temp;
                        setCsapatok(ujCsapatok);
                        
                        const ujSzinek = [...csapatSzinek];
                        const tempSzin = ujSzinek[kivalasztottCsapat];
                        ujSzinek[kivalasztottCsapat] = ujSzinek[index];
                        ujSzinek[index] = tempSzin;
                        setCsapatSzinek(ujSzinek);

                        setManualOverrides({}); // Globális csere esetén a kézi felülírásokat nullázzuk
                    }
                    setKivalasztottCsapat(null);
                }
            };

            // 2. Egyedi cella felülírása a táblázatban (Csak arra az egy helyre hat)
            const handleTableTeamClick = (rink, rowIndex, side) => {
                if (kivalasztottCsapat !== null) {
                    const key = `${rink}-${rowIndex}-${side}`; // pl: "A-0-h"
                    setManualOverrides(prev => ({
                        ...prev,
                        [key]: kivalasztottCsapat
                    }));
                    setKivalasztottCsapat(null); // Csere után elengedjük a csapatot
                }
            };

            // --- VARÁZSDOBOZ: BEILLESZTÉS ÉS AZONNALI SABLONVÁLASZTÁS ---
            const handleExcelPaste = (e) => {
                const text = e.target.value;
                if (!text) return;

                let ujAdatok = { ...tornaAdatok, info: '', infoSzin: '#dc2626' };
                let ujCsapatok = ['', '', '', '', '', '', '', ''];
                let talaltCsapatokSzama = 0;

                setUtkozesEngedelyezve(false); 
                setKivalasztottCsapat(null);
                setManualOverrides({});
                
                const rawLines = text.split('\n').map(l => l.trim()).filter(l => l !== '');
                if (rawLines.length === 0) return;

                // 1. FEJLÉC KERESÉSE
                for (let i = 0; i < Math.min(3, rawLines.length); i++) {
                    const tabs = rawLines[i].split('\t').map(c => c.trim());
                    if (tabs.length >= 4) {
                        if (tabs[0]) {
                            ujAdatok.sorszam = tabs[0];
                            const uMatch = tabs[0].match(/(U8|U10)/i);
                            if (uMatch) ujAdatok.korosztaly = uMatch[1].toUpperCase();
                            const csMatch = tabs[0].match(/\b([A-C])\b/i);
                            if (csMatch) ujAdatok.csoport = csMatch[1].toUpperCase();
                        }
                        if (tabs[1]) {
                            const dMatch = tabs[1].match(/(\d{4})\.(\d{2})\.(\d{2})/);
                            if (dMatch) ujAdatok.datum = `${dMatch[1]}-${dMatch[2]}-${dMatch[3]}`;
                        }
                        if (tabs[2]) {
                            const idoMatch = tabs[2].match(/\b(\d{1,2}):(\d{2})\b/);
                            if (idoMatch) ujAdatok.kezdes = idoMatch[1] === '0' && idoMatch[2] === '00' ? '00:00' : `${idoMatch[1].padStart(2, '0')}:${idoMatch[2]}`;
                        }
                        if (tabs[3]) ujAdatok.rendezo = tabs[3];
                        if (tabs.length >= 5 && tabs[4]) ujAdatok.helyszin = tabs[4];
                        break;
                    }
                }

                // 2. CSAPATOK KERESÉSE
                for (let i = 0; i < rawLines.length; i++) {
                    const line = rawLines[i];
                    const teamMatch = line.match(/^\d{1,2}[\.\)]\s*(.+)$/);
                    if (teamMatch && !teamMatch[1].toLowerCase().includes('résztvevők') && talaltCsapatokSzama < 8) { 
                        const tName = teamMatch[1].split('\t')[0].trim();
                        if(tName && !tName.toUpperCase().includes('PÁLYA') && tName.toUpperCase() !== 'KEZDŐ') {
                            ujCsapatok[talaltCsapatokSzama] = tName;
                            talaltCsapatokSzama++; 
                        }
                    } else if (line.match(/^\d{1,2}[\.\)]?(?!\d)$/)) {
                        if (i + 1 < rawLines.length && talaltCsapatokSzama < 8) { 
                            const tName = rawLines[i + 1].split('\t')[0].trim();
                            if(tName && !tName.toUpperCase().includes('PÁLYA') && tName.toUpperCase() !== 'KEZDŐ') {
                                ujCsapatok[talaltCsapatokSzama] = tName;
                                talaltCsapatokSzama++; 
                                i++; 
                            }
                        }
                    }
                }

                if (talaltCsapatokSzama > 0) {
                    ujAdatok.szint = autoSelectTemplate(ujAdatok, ujCsapatok, text);
                }

                setTornaAdatok(ujAdatok);
                setCsapatok(ujCsapatok);
                setCsapatSzinek(Array(8).fill('#1e293b'));
                setTimeout(() => setPastedData(''), 100);
            };

            // 3. A Sorsolási Sablonok Tárháza (INLINE HIVATALOS SABLONOK)
            const sablonData = {
                '3cs_4m_1p': [
                    { meccsek: [{h:0,v:1}] }, { kor: 'ROLBA' },
                    { meccsek: [{h:2,v:1}] }, { kor: 'ROLBA' },
                    { meccsek: [{h:0,v:2}] }, { kor: 'ZARAS' }
                ],
                '4cs_4m_1p': [
                    { meccsek: [{h:0,v:1}] }, { meccsek: [{h:2,v:3}] }, { kor: 'ROLBA' },
                    { meccsek: [{h:2,v:0}] }, { meccsek: [{h:1,v:3}] }, { kor: 'ROLBA' },
                    { meccsek: [{h:0,v:3}] }, { meccsek: [{h:1,v:2}] }, { kor: 'ZARAS' }
                ],
                '4cs_4m_2p': [
                    { meccsek: [{h:0,v:1}, {h:2,v:3}] }, { kor: 'ROLBA' },
                    { meccsek: [{h:0,v:2}, {h:1,v:3}] }, { kor: 'ROLBA' },
                    { meccsek: [{h:2,v:1}, {h:3,v:0}] }, { kor: 'ZARAS' }
                ],
                '5cs_4m_2p': [
                    { meccsek: [{h:0,v:3}, {h:2,v:4}] }, { kor: 'ROLBA' },
                    { meccsek: [{h:0,v:1}, {h:2,v:3}] }, { kor: 'ROLBA' },
                    { meccsek: [{h:4,v:0}, {h:3,v:1}] }, { kor: 'ROLBA' },
                    { meccsek: [{h:2,v:0}, {h:4,v:1}] }, { kor: 'ZARAS' }
                ],
                '6cs_4m_3p': [
                    { meccsek: [{h:0,v:3}, {h:1,v:5}, {h:2,v:4}] }, { kor: 'ROLBA' },
                    { meccsek: [{h:0,v:4}, {h:1,v:3}, {h:2,v:5}] }, { kor: 'ROLBA' },
                    { meccsek: [{h:0,v:5}, {h:1,v:4}, {h:2,v:3}] }, { kor: 'ZARAS' }
                ]
            };

            const sablonAdatbazis = {};
            Object.keys(sablonData).forEach(key => {
                if (key.includes('_2p') || key.includes('_3p')) { 
                    sablonAdatbazis[`${key}_side`] = sablonData[key]; 
                } else { 
                    sablonAdatbazis[key] = sablonData[key]; 
                }
            });

            // 4. Matek és Elrendezés
            const meccsPerc = tornaAdatok.egyediMeccsPerc ? parseInt(tornaAdatok.egyediMeccsPerc, 10) : 20;
            const rolbaPerc = tornaAdatok.egyediSzunetPerc ? parseInt(tornaAdatok.egyediSzunetPerc, 10) : 20;
            const bemelegitesPerc = tornaAdatok.egyediBemelegitesPerc ? parseInt(tornaAdatok.egyediBemelegitesPerc, 10) : 10;
            const palyaBetuk = ["A", "B", "C", "D", "E", "F"];
            const msz = useMemo(() => sablonAdatbazis[tornaAdatok.szint] || sablonAdatbazis['4cs_4m_2p_side'], [tornaAdatok.szint]);

            const isCsoportWarning = useMemo(() => {
                return tornaAdatok.csoport && ['A', 'B'].includes(tornaAdatok.csoport.toUpperCase()) && tornaAdatok.szint.includes('3m');
            }, [tornaAdatok.csoport, tornaAdatok.szint]);

            const palyakSzama = useMemo(() => {
                if (!msz || !msz[0].meccsek) return 1;
                let max = 1;
                msz.forEach(s => { if (s.meccsek && s.meccsek.length > max) max = s.meccsek.length; });
                return max;
            }, [msz]);

            useEffect(() => { setTornaAdatok(prev => ({...prev, palyaTipus: `${palyakSzama}_palya`})); }, [palyakSzama]);

            // --- INLINE OKOS IDŐSZÁMÍTÓ MOTOR ---
            const getIdopont = (korIndex) => {
                let [ora, perc] = (tornaAdatok.kezdes || '00:00').split(':').map(Number);
                let ossz = ora * 60 + perc;

                if (msz) {
                    for (let i = 0; i < korIndex; i++) {
                        const currentSor = msz[i];
                        const nextSor = i + 1 < msz.length ? msz[i + 1] : null;

                        if (currentSor.kor === 'ROLBA') {
                            // Ha ROLBA/SZÜNET volt, hozzáadjuk a szünetet(20) és a következő meccs bemelegítését(10)
                            ossz += rolbaPerc + bemelegitesPerc; 
                        } else if (currentSor.kor !== 'ZARAS') {
                            // Ha MECCS volt, megnézzük mi jön utána
                            if (nextSor && !nextSor.kor) { 
                                // Ha a következő IS MECCS (4 csapat 1 pálya), akkor: meccs(20) + csere(5) + bemelegítés(10)
                                ossz += meccsPerc + 5 + bemelegitesPerc; 
                            } else {
                                // Ha a következő SZÜNET vagy ZÁRÁS, akkor csak maga a meccs hossza(20)
                                ossz += meccsPerc;
                            }
                        }
                    }
                }
                return `${Math.floor(ossz / 60)}:${(ossz % 60).toString().padStart(2, '0')}`;
            };

            const rinkSchedules = useMemo(() => {
                const s = {};
                Array.from({ length: palyakSzama }).forEach((_, i) => { s[palyaBetuk[i]] = []; });
                if (msz) {
                    let team0Count = 0;
                    const is3mTemplate = tornaAdatok.szint.includes('3m');
                    msz.forEach((sor, idx) => {
                        const ido = getIdopont(idx);
                        if (sor.kor === 'ROLBA') { Object.keys(s).forEach(k => s[k].push({ tipus: 'rolba', ido })); }
                        else if (sor.kor === 'ZARAS') { Object.keys(s).forEach(k => s[k].push({ tipus: 'zaras', ido })); }
                        else {
                            Array.from({ length: palyakSzama }).forEach((_, pIdx) => {
                                const rinkLetter = palyaBetuk[pIdx];
                                const meccs = sor.meccsek[pIdx];
                                if (meccs) {
                                    let isHRed = false; let isVRed = false;
                                    if (is3mTemplate) {
                                        if (meccs.h === 0) { team0Count++; if (team0Count === 4) isHRed = true; }
                                        if (meccs.v === 0) { team0Count++; if (team0Count === 4) isVRed = true; }
                                    }
                                    s[rinkLetter].push({ tipus: 'meccs', ido, h: meccs.h, v: meccs.v, isHRed, isVRed });
                                } else { s[rinkLetter].push({ tipus: 'szabad', ido }); }
                            });
                        }
                    });
                }
                return s;
            }, [msz, palyakSzama, tornaAdatok.kezdes, meccsPerc, rolbaPerc, bemelegitesPerc, tornaAdatok.szint]);

            const mainGridConfig = useMemo(() => {
                const levels = tornaAdatok.szint.split('_');
                const pNum = parseInt(levels[levels.length - 2]); 
                const layout = levels[levels.length - 1]; 

                if (tornaAdatok.szint.includes('1p') || pNum === 1) return "grid-cols-1"; 
                if (pNum === 2) {
                    if (layout === 'stack') return "grid-cols-1 grid-rows-2 gap-y-12"; 
                    return "grid-cols-2 gap-x-6"; 
                }
                if (pNum === 3) {
                    if (layout === 'mixed') return "grid-cols-2 grid-rows-2 gap-x-6 gap-y-12"; 
                    return "grid-cols-3 gap-x-4"; 
                }
                if (pNum === 4) return "grid-cols-2 grid-rows-2 gap-x-6 gap-y-12"; 
                return "grid-cols-1"; 
            }, [tornaAdatok.szint]);

            const getRinkPlacement = (rinkLetter) => {
                const levels = tornaAdatok.szint.split('_');
                const layout = levels[levels.length - 1];

                if (layout === 'mixed') { 
                    if (rinkLetter === 'A') return "row-start-1 col-start-1";
                    if (rinkLetter === 'B') return "row-start-2 col-start-1";
                    if (rinkLetter === 'C') return "row-start-1 row-end-3 col-start-2";
                }
                if (layout === 'grid') { 
                    if (rinkLetter === 'A') return "row-start-1 col-start-1";
                    if (rinkLetter === 'C') return "row-start-1 col-start-2";
                    if (rinkLetter === 'B') return "row-start-2 col-start-1";
                    if (rinkLetter === 'D') return "row-start-2 col-start-2";
                }
                return "col-span-1"; 
            };

            const isInvalidTeam = (nev) => !nev || nev.toUpperCase() === 'SZABAD';
            const logofile = getLogoName(tornaAdatok.rendezo);

// ✂️ ------------------------------------------------- ✂️

            return (
                <div className="flex flex-col md:flex-row h-screen font-sans overflow-hidden bg-slate-200">
                    
                    {/* ✂️ --- 3. BLOKK HELYE: BAL OLDAL (VEZÉRLŐPULT) --- ✂️ */}
                    <div className="w-full md:w-96 bg-slate-900 text-white p-5 overflow-y-auto shadow-2xl z-20 print-hide h-full shrink-0 flex flex-col gap-4 custom-scrollbar">
                        
                        <h2 className="text-xl font-black text-orange-400 border-b border-slate-700 pb-3 flex justify-between items-center">
                            INLINE v1.0
                            <label className={`flex items-center gap-1.5 text-[10px] uppercase font-bold cursor-pointer px-2 py-1.5 rounded transition ${utkozesEngedelyezve ? 'bg-green-900/40 text-green-400' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`} title="Pipáld be, ha JÓVÁHAGYOD a testvérharcot (eltűnik a sárga figyelmeztetés)">
                                <input type="checkbox" checked={utkozesEngedelyezve} onChange={() => setUtkozesEngedelyezve(!utkozesEngedelyezve)} className="accent-green-500 w-3 h-3"/>
                                Testvérharc OK
                            </label>
                        </h2>

                        <a href="index.html" className="w-full bg-blue-700 hover:bg-blue-600 text-white text-center font-bold py-2 rounded-lg shadow-md transition-all text-xs uppercase tracking-widest flex items-center justify-center gap-2">
                            🏒 Átváltás Jégkorongra
                        </a>
                        
                        <div className="bg-yellow-900/30 border border-yellow-600/50 rounded-lg p-3">
                            <label className="block text-yellow-500 uppercase font-black mb-2 tracking-widest text-[10px]">🪄 Varázsdoboz (Beolvasás)</label>
                            <textarea value={pastedData} onChange={handleExcelPaste} placeholder="Másold be ide a tornát..." className="w-full bg-slate-800/80 p-2 rounded border border-slate-600 text-slate-200 text-sm h-20 focus:outline-none focus:border-yellow-500 placeholder-slate-500"/>
                        </div>

                        {(!tornaAdatok.kezdes || csapatok.slice(0, parseInt(tornaAdatok.szint.match(/^\d+/)?.[0] || 4)).some(c => !c)) && (
                            <div className="bg-red-900/50 text-red-200 p-2 rounded text-xs border border-red-800 font-bold text-center animate-pulse">⚠️ Hiányzó adatok (piros)!</div>
                        )}

                        <div className="space-y-4 text-sm">
                            <section className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                                <label className="block text-slate-400 uppercase font-bold mb-3 text-xs">Alapbeállítások</label>
                                
                                <div className="grid grid-cols-3 gap-2 mb-3">
                                    <select value={tornaAdatok.korosztaly} onChange={e => {
                                        const ujAdatok = {...tornaAdatok, korosztaly: e.target.value};
                                        const ujSzint = autoSelectTemplate(ujAdatok, csapatok);
                                        setTornaAdatok({...ujAdatok, szint: ujSzint});
                                    }} className="bg-slate-700 p-2 rounded font-bold text-sm outline-none"><option value="U8">U8</option><option value="U10">U10</option></select>

                                    <select value={tornaAdatok.csoport} onChange={e => {
                                        const ujAdatok = {...tornaAdatok, csoport: e.target.value};
                                        const ujSzint = autoSelectTemplate(ujAdatok, csapatok);
                                        setTornaAdatok({...ujAdatok, szint: ujSzint});
                                    }} className={`p-2 rounded font-bold text-center text-sm outline-none ${isCsoportWarning ? 'bg-red-900 focus:ring-red-500' : 'bg-slate-700'}`}><option value="">- Nincs -</option><option value="A">A csop.</option><option value="B">B csop.</option><option value="C">C csop.</option></select>
                                    
                                    <input type="time" value={tornaAdatok.kezdes} onChange={e => setTornaAdatok({...tornaAdatok, kezdes: e.target.value})} className={`p-2 rounded border font-bold text-sm ${!tornaAdatok.kezdes ? 'bg-red-900/80 border-red-500' : 'bg-slate-700 border-slate-600'}`}/>
                                </div>
                                
                                <div className="flex gap-2">
                                    <select 
                                        value={tornaAdatok.szint} 
                                        onChange={e => setTornaAdatok({...tornaAdatok, szint: e.target.value})} 
                                        className={`w-full p-2 rounded text-sm font-bold border outline-none ${isCsoportWarning ? 'bg-red-900 border-red-500' : 'bg-slate-700 border-slate-600'}`}
                                    >
                                        <option value="3cs_4m_1p">3 Csapat / 1 Pálya</option>
                                        <option value="4cs_4m_1p">4 Csapat / 1 Pálya</option>
                                        <option value="4cs_4m_2p_side">4 Csapat / 2 Pálya</option>
                                        <option value="5cs_4m_2p_side">5 Csapat / 2 Pálya</option>
                                        <option value="6cs_4m_3p_side">6 Csapat / 3 Pálya</option>
                                    </select>

                                    <input 
                                        type="number" 
                                        placeholder="Bem." 
                                        className="w-14 bg-slate-700 text-white p-2 rounded text-sm font-bold border border-slate-600 focus:outline-none text-center"
                                        value={tornaAdatok.egyediBemelegitesPerc} 
                                        onChange={(e) => setTornaAdatok({ ...tornaAdatok, egyediBemelegitesPerc: e.target.value })}
                                        title="Bemelegítés hossza"
                                    />

                                    <input 
                                        type="number" 
                                        placeholder="Meccs" 
                                        className="w-14 bg-slate-700 text-white p-2 rounded text-sm font-bold border border-slate-600 focus:outline-none text-center"
                                        value={tornaAdatok.egyediMeccsPerc} 
                                        onChange={(e) => setTornaAdatok({ ...tornaAdatok, egyediMeccsPerc: e.target.value })}
                                        title="Meccs hossza"
                                    />

                                    <input 
                                        type="number" 
                                        placeholder="Szün." 
                                        className="w-14 bg-slate-700 text-white p-2 rounded text-sm font-bold border border-slate-600 focus:outline-none text-center"
                                        value={tornaAdatok.egyediSzunetPerc} 
                                        onChange={(e) => setTornaAdatok({ ...tornaAdatok, egyediSzunetPerc: e.target.value })}
                                        title="Szünet hossza"
                                    />
                                </div>
                                
                                {isCsoportWarning && (
                                    <div className="mt-2 bg-red-950/50 text-red-300 p-1.5 rounded text-xs text-center font-bold border border-red-800">
                                        ⚠️ A/B csoport van megadva, de 3 meccses (C szintű) sablont használsz!
                                    </div>
                                )}
                            </section>

                            <section className="space-y-3">
                                <input type="text" value={tornaAdatok.sorszam} onChange={e => setTornaAdatok({...tornaAdatok, sorszam: e.target.value})} className="w-full bg-slate-800 p-2.5 rounded border border-slate-700 font-bold text-sm placeholder-slate-500" placeholder="Torna sorszáma (pl. SZMINI 205)"/>
                                <input type="date" value={tornaAdatok.datum} onChange={e => setTornaAdatok({...tornaAdatok, datum: e.target.value})} className="w-full bg-slate-800 p-2.5 rounded border border-slate-700 text-white text-sm font-bold"/>
                                <input type="text" list="csapat-lista" value={tornaAdatok.rendezo} onChange={e => setTornaAdatok({...tornaAdatok, rendezo: e.target.value})} className="w-full bg-slate-800 p-2.5 rounded border border-slate-700 text-sm" placeholder="Rendező egyesület (Logóhoz)"/>
                                <input type="text" list="helyszin-lista" value={tornaAdatok.helyszin} onChange={e => {
                                    const ujAdatok = {...tornaAdatok, helyszin: e.target.value};
                                    const ujSzint = autoSelectTemplate(ujAdatok, csapatok);
                                    setTornaAdatok({...ujAdatok, szint: ujSzint});
                                }} className="w-full bg-slate-800 p-2.5 rounded border border-slate-700 text-sm" placeholder="Válassz Helyszínt..."/>
                                <datalist id="helyszin-lista">{csarnokNevekLista.map(nev => <option key={nev} value={nev} />)}</datalist>
                                
                                <div className="flex gap-2 items-center">
                                    <input type="text" list="info-javaslatok" value={tornaAdatok.info} onChange={e => {
                                        const ujAdatok = {...tornaAdatok, info: e.target.value};
                                        const ujSzint = autoSelectTemplate(ujAdatok, csapatok);
                                        setTornaAdatok({...ujAdatok, szint: ujSzint});
                                    }} className="flex-grow min-w-0 bg-slate-800 p-2.5 rounded border border-slate-700 text-slate-200 font-bold text-sm placeholder-slate-500 focus:outline-none focus:border-yellow-500" placeholder="Extra infó (pl. KISPÁLYA)"/>
                                    
                                    <input type="color" value={tornaAdatok.infoSzin || '#dc2626'} onChange={e => setTornaAdatok({...tornaAdatok, infoSzin: e.target.value})} className="w-10 h-10 p-0 border-0 rounded cursor-pointer bg-transparent shrink-0" title="Válassz színt az extra infónak!" />
                                </div>
                                
                                <datalist id="info-javaslatok">
                                    <option value="KEZDŐ"></option>
                                    <option value="KISPÁLYA"></option>
                                    <option value="2 PÁLYÁN"></option>
                                    <option value="3 PÁLYÁN"></option>
                                    <option value="4 PÁLYÁN"></option>
                                </datalist>
                                <datalist id="csapat-lista">{csapatNevekLista.map(nev => <option key={nev} value={nev} />)}</datalist>
                            </section>

                            <section className="pt-4 border-t border-slate-700">
                                <label className="block text-slate-400 uppercase font-bold mb-3 text-xs">Résztvevő Csapatok</label>
                                {csapatok.map((cs, i) => {
                                    const requiredMatch = tornaAdatok.szint.match(/^\d+/);
                                    const maxCsapat = requiredMatch ? parseInt(requiredMatch[0]) : 8;
                                    const isNeeded = i < maxCsapat;
                                    const isError = isNeeded && !cs;
                                    
                                    // Ellenőrizzük, hogy ez a mező van-e kijelölve cserére
                                    const isSelectedForSwap = kivalasztottCsapat === i;

                                    return (
                                        <div key={i} className={`flex items-center gap-2 mb-2 ${!isNeeded ? 'opacity-30' : ''}`}>
                                            <span className="w-5 text-center text-slate-500 font-black text-sm">{i+1}</span>
                                            <input 
                                                type="text" 
                                                list="csapat-lista" 
                                                value={cs} 
                                                onChange={e => {const n = [...csapatok]; n[i] = e.target.value; setCsapatok(n);}} 
                                                onClick={() => isNeeded && handleTeamClick(i)}
                                                readOnly={isSelectedForSwap}
                                                className={`flex-grow p-2 rounded border text-sm font-bold transition-all cursor-pointer ${
                                                    isSelectedForSwap 
                                                        ? 'bg-green-900/40 border-green-500 ring-2 ring-green-500' 
                                                        : isError 
                                                            ? 'bg-red-900/50 border-red-500' 
                                                            : 'bg-slate-800 border-slate-700 focus:border-blue-500'
                                                }`} 
                                                placeholder={`Csapat ${i+1}`} 
                                                disabled={!isNeeded}
                                            />
                                            {/* ÚJ: Csapat saját színválasztója */}
                                            <input type="color" value={csapatSzinek[i]} onChange={e => {const n = [...csapatSzinek]; n[i] = e.target.value; setCsapatSzinek(n);}} className="w-8 h-8 p-0 border-0 rounded cursor-pointer bg-transparent shrink-0" disabled={!isNeeded} title="Csapat színének módosítása"/>
                                        </div>
                                    )
                                })}
                            </section>

                            {/* --- ÚJ: MENTÉS ÉS BETÖLTÉS GOMBOK --- */}
                            <div className="flex gap-2 pt-2">
                                <button onClick={handleSaveJSON} className="flex-1 bg-emerald-700 hover:bg-emerald-600 text-white font-bold py-2.5 rounded shadow text-xs tracking-wider flex justify-center items-center transition-colors">
                                    💾 MENTÉS
                                </button>
                                <input type="file" accept=".json" onChange={handleLoadJSON} ref={fileInputRef} className="hidden" />
                                <button onClick={() => fileInputRef.current.click()} className="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-2.5 rounded shadow text-xs tracking-wider flex justify-center items-center transition-colors">
                                    📂 BETÖLTÉS
                                </button>
                            </div>

                            {/* MÓDOSÍTVA: OKOS PDF GOMB */}
                            <button onClick={handleSmartPrint} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-3 rounded-lg shadow-lg text-sm transition-all print-hide">
                                PDF MENTÉSE
                            </button>
                        </div>
                    </div>
                    {/* ✂️ ----------------------------------------------- ✂️ */}

                    {/* ✂️ --- 4. BLOKK HELYE: JOBB OLDAL (NYOMTATÁSI DIZÁJN ÉS RÁCSOK) --- ✂️ */}
                    <div className="flex-grow overflow-auto flex justify-center p-4 bg-slate-500 print:p-0 print:bg-white custom-scrollbar relative">
                        <div id="nyomtatasi-terulet" className="bg-white w-[297mm] h-[210mm] relative shadow-2xl shrink-0 overflow-hidden text-black font-sans" style={{ WebkitPrintColorAdjust: 'exact', printColorAdjust: 'exact' }}>

                            {/* --- FEJLÉC (Homokszínű háttér) --- */}
                            <div className="absolute top-0 left-0 w-full h-[45mm] bg-[#f4ebe1] flex items-center justify-between px-[10mm] border-b-[2px] border-black">
                                {/* Bal logó - FIX INLINE LOGÓ */}
                                <div className="w-[45mm] h-[35mm] flex items-center justify-center">
                                     <img src="Csapat_logok/inline_logo.png" className="max-h-full max-w-full object-contain" alt="Inline" />
                                </div>
                                {/* Középső adatok */}
                                <div className="flex-1 flex flex-col items-center justify-center text-center leading-tight">
                                     <div className="text-[28px] font-black text-red-800 uppercase tracking-wide">{tornaAdatok.sorszam}</div>
                                     <div className="text-[22px] font-black mt-1">{formatDatum(tornaAdatok.datum)}</div>
                                     <div className="text-[20px] font-bold mt-2">{tornaAdatok.helyszin}</div>
                                     <div className="text-[18px] font-bold uppercase mt-1">{tornaAdatok.rendezo}</div>
                                </div>
                                {/* Jobb logó */}
                                <div className="w-[45mm] h-[35mm] flex items-center justify-center">
                                    <img src="Csapat_logok/inline_mjsz.png" className="max-h-full max-w-full object-contain" alt="MJSZ" />
                                </div>
                            </div>

                            {/* --- TÁBLÁZAT --- */}
                            <div className="absolute top-[50mm] left-[8mm] right-[8mm] flex flex-col border-[2px] border-black shadow-sm">
                                
                                {/* TÁBLÁZAT FEJLÉC (Sötétszürke) */}
                                <div className="flex bg-[#555555] text-white font-bold text-center items-stretch border-b-[2px] border-black text-[14px]">
                                    <div className="w-[30mm] flex items-center justify-center p-2 border-r border-black leading-tight">Bemelegítés<br/>kezdete</div>
                                    <div className="w-[30mm] flex items-center justify-center p-2 border-r border-black leading-tight">Mérkőzés<br/>kezdete</div>
                                    {palyaBetuk.slice(0, palyakSzama).map(rink => (
                                        <div key={rink} className="flex-1 flex items-center justify-center p-2 border-r last:border-r-0 border-black uppercase tracking-wider">
                                            "{rink}" Pálya {rink === 'A' ? <span className="text-[10px] font-normal normal-case ml-1 text-gray-300">(rolba felöli oldal)</span> : ''}
                                        </div>
                                    ))}
                                </div>

                                {/* TÁBLÁZAT SORAI */}
                                <div className="flex-col divide-y divide-black/40">
                                    {rinkSchedules['A']?.map((row, i) => {
                                        let bemIdo = "";
                                        if (row.ido) {
                                            let [ora, perc] = row.ido.split(':').map(Number);
                                            let osszPerc = ora * 60 + perc - (bemelegitesPerc || 10);
                                            if (osszPerc < 0) osszPerc += 1440;
                                            bemIdo = `${Math.floor(osszPerc / 60)}:${(osszPerc % 60).toString().padStart(2, '0')}`;
                                        }

                                        if (row.tipus === 'zaras') {
                                            return (
                                                <div key={i} className="flex bg-[#555555] text-white font-bold text-center items-stretch h-[10mm]">
                                                    <div className="w-[30mm] border-r border-black"></div>
                                                    <div className="w-[30mm] flex items-center justify-center border-r border-black">{row.ido}</div>
                                                    <div className="flex-1 flex items-center justify-center uppercase tracking-widest text-[16px]">TORNA ZÁRÁSA</div>
                                                </div>
                                            );
                                        }
                                        
                                        if (row.tipus === 'rolba') {
                                            return (
                                                <div key={i} className="flex bg-[#555555] text-white font-bold text-center items-stretch h-[9mm]">
                                                    <div className="w-[30mm] border-r border-black"></div>
                                                    <div className="w-[30mm] flex items-center justify-center border-r border-black">{row.ido}</div>
                                                    <div className="flex-1 flex items-center justify-center uppercase tracking-widest text-[16px]">
                                                        SZÜNET
                                                    </div>
                                                </div>
                                            );
                                        }

                                        let lastRolbaIdx = -1;
                                        for (let k = 0; k < i; k++) { if (rinkSchedules['A'][k].tipus === 'rolba') lastRolbaIdx = k; }
                                        const relativIdx = i - (lastRolbaIdx + 1);
                                        
                                        // Itt állítjuk be a színeket! f4ebe1 az alap homokszín, e5d8c8 egy picivel sötétebb zebra árnyalat
                                        const rowBg = relativIdx % 2 === 0 ? 'bg-[#f4ebe1]' : 'bg-[#e5d8c8]';

                                        return (
                                            <div key={i} className={`flex text-black font-bold text-center items-stretch flex-1 ${rowBg}`}>
                                                <div className="w-[30mm] flex items-center justify-center border-r border-black/40 text-[#b91c1c] text-[16px] py-1.5">{bemIdo}</div>
                                                <div className="w-[30mm] flex items-center justify-center border-r border-black/40 text-[16px] py-1.5">{row.ido}</div>
                                                
                                                {palyaBetuk.slice(0, palyakSzama).map(rink => {
                                                    const matchRow = rinkSchedules[rink][i];
                                                    if (!matchRow || matchRow.tipus !== 'meccs') return <div key={rink} className="flex-1 border-r last:border-r-0 border-black/40"></div>;

                                                    const valosH = csapatok[manualOverrides[`${rink}-${i}-h`] ?? matchRow.h];
                                                    const valosV = csapatok[manualOverrides[`${rink}-${i}-v`] ?? matchRow.v];
                                                    
                                                    const isTestver = !utkozesEngedelyezve && areSameClub(valosH, valosV);
                                                    const cellBg = isTestver ? 'bg-yellow-300/60' : 'bg-transparent';

                                                    return (
                                                        <div key={rink} className={`flex-1 flex border-r last:border-r-0 border-black/40 ${cellBg} text-[14px]`}>
                                                            <div className="flex-1 flex items-center justify-center px-2 cursor-pointer hover:bg-blue-200 transition-colors py-1.5" onClick={() => handleTableTeamClick(rink, i, 'h')}>
                                                                {isInvalidTeam(valosH) ? '' : valosH}
                                                            </div>
                                                            <div className="w-[6mm] flex items-center justify-center text-gray-500 font-normal">-</div>
                                                            <div className="flex-1 flex items-center justify-center px-2 cursor-pointer hover:bg-blue-200 transition-colors py-1.5" onClick={() => handleTableTeamClick(rink, i, 'v')}>
                                                                {isInvalidTeam(valosV) ? '' : valosV}
                                                            </div>
                                                        </div>
                                                    )
                                                })}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                                                    )
                                                })}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* --- LÁBLÉC --- */}
                            <div className="absolute bottom-[4mm] left-[8mm] right-[8mm] flex justify-between text-[11px] font-bold text-gray-500 tracking-wide">
                                <div>{/* --- BAL LÁBLÉC --- */} </div>
                                <div className="text-red-700 uppercase">{/* --- KÖZÉPSŐ LÁBLÉC --- */}</div>
                                <div>{/* --- JOBB LÁBLÉC --- */}</div>
                            </div>

                        </div>
                    </div>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SorsolasApp />);
    </script>
</body>
</html>
