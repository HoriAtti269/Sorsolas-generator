                    alert('Ez még a régi, sor alapú mentés — ebben a verzióban nem nyitható meg.');
                } else alert('A fájl nem tartalmaz menetrendet.');
            } catch (err) { alert('Hibás fájl: ' + err.message); }
        };
        r.readAsText(file);
        e.target.value = '';
    };

    const visszaallit = () => {
        if (!confirm('Visszaáll minden a 2025-ös alapsablonra, CSAPAT-nevekkel. Biztos?')) return;
        setCsoportok(csapatNevekGeneral(ADAT.csoportok));
        setNapok(masol(ADAT.napok));
    };

    return (
        <div id="gyoker" className="flex flex-col md:flex-row h-screen font-sans overflow-hidden bg-slate-200">

            {/* BAL OLDAL: VEZÉRLŐPULT */}
            <div className="w-full md:w-96 bg-slate-900 text-white p-4 overflow-y-auto shadow-2xl z-20 print-hide h-full shrink-0 flex flex-col gap-3 custom-scrollbar">

                <h2 className="text-lg font-black text-emerald-400 border-b border-slate-700 pb-2">
                    NYITÓFESZTIVÁL MENETREND
                </h2>

                <div className="grid grid-cols-2 gap-2">
                    <button onClick={() => window.print()}
                        className="bg-emerald-600 hover:bg-emerald-500 py-2 rounded font-bold text-xs">🖨 Nyomtatás / PDF</button>
                    <button onClick={xlsExport}
                        className="bg-blue-600 hover:bg-blue-500 py-2 rounded font-bold text-xs">📊 Excel mentés</button>
                    <button onClick={mentes}
                        className="bg-slate-700 hover:bg-slate-600 py-2 rounded font-bold text-xs">💾 Munka mentése</button>
                    <label className="bg-slate-700 hover:bg-slate-600 py-2 rounded font-bold text-xs text-center cursor-pointer">
                        📂 Megnyitás
                        <input type="file" accept=".json" onChange={betoltes} className="hidden" />
                    </label>
                </div>

                {/* Figyelmeztetések */}
                {figyelmeztetesek.length > 0 && (
                    <div className="bg-amber-900/40 border border-amber-600/60 rounded-lg p-2 space-y-1">
                        {figyelmeztetesek.map((f, i) => (
                            <div key={i} className={`text-[11px] leading-tight ${f.tipus === 'hiba' ? 'text-red-300' : 'text-amber-200'}`}>
                                {f.tipus === 'hiba' ? '⛔' : '🧊'} {f.szoveg}
                                {f.beszur && <button onClick={() => korBeszur(f.beszur.napIdx, f.beszur.csoport, f.beszur.kor)}
                                    className="ml-1 px-1 bg-emerald-700 hover:bg-emerald-600 rounded text-white font-bold">
                                    beszúrom
                                </button>}
                                {f.zaras !== undefined && <button onClick={() => zarasBeszur(f.zaras)}
                                    className="ml-1 px-1 bg-emerald-700 hover:bg-emerald-600 rounded text-white font-bold">
                                    beszúrom
                                </button>}
                            </div>
                        ))}
                    </div>
                )}

                {/* Nyomtatási válogatás */}
                <section className="bg-slate-800 p-3 rounded-xl border border-slate-700 space-y-2">
                    <div className="text-slate-400 font-bold text-[11px]">NYOMTATÁS / EXPORT — MI KERÜLJÖN RÁ</div>
                    {lapok.map((nap, ni) => (
                        <label key={ni} className="flex items-center gap-2 text-[11px] cursor-pointer">
                            <input type="checkbox" checked={!!nyomtatLapok[ni]} className="accent-emerald-500"
                                onChange={() => setNyomtatLapok(prev => prev.map((v, i) => i === ni ? !v : v))} />
                            {nap.nap} — {nap.hely}
                        </label>
                    ))}
                    <div className="flex items-center gap-2 pt-1 border-t border-slate-700">
                        <span className="text-[11px] text-slate-300">Szintek</span>
                        {['A', 'B', 'C'].map(sz => (
                            <label key={sz} className="flex items-center gap-1 text-[11px] cursor-pointer">
                                <input type="checkbox" checked={nyomtatSzintek.indexOf(sz) >= 0} className="accent-emerald-500"
                                    onChange={() => setNyomtatSzintek(prev =>
                                        prev.indexOf(sz) >= 0 ? prev.filter(x => x !== sz) : [...prev, sz].sort())} />
                                {sz}
                            </label>
                        ))}
                    </div>
                    <label className="flex items-center gap-2 text-[11px] cursor-pointer">
                        <input type="checkbox" checked={kulonLapra} className="accent-emerald-500"
                            onChange={() => setKulonLapra(!kulonLapra)} />
                        Szintenként külön oldalra
                    </label>
                    <div className="text-[10px] text-slate-400 leading-tight">
                        {szeletek.length} oldal. Az időpontok a teljes menetrendből jönnek, szűrve sem csúsznak el.
                    </div>
                </section>

                {/* Időzítés */}
                <section className="bg-slate-800 p-3 rounded-xl border border-slate-700 space-y-3">
                    <div className="text-slate-400 font-bold text-[11px]">IDŐZÍTÉS</div>

                    <div className="flex items-center gap-2 text-xs">
                        <label className="w-32 text-slate-300">Átállás két meccs közt</label>
                        <input type="number" value={atallas} onChange={e => setAtallas(parseInt(e.target.value, 10) || 0)}
                            className="bg-slate-700 p-1 rounded w-14 text-center" />
                        <span className="text-slate-500">perc</span>
                    </div>
                    <div className="flex items-center gap-2 text-xs">
                        <label className="w-32 text-slate-300">Rolbagép átállása</label>
                        <input type="number" value={rolbaGepAtallas} onChange={e => setRolbaGepAtallas(parseInt(e.target.value, 10) || 0)}
                            className="bg-slate-700 p-1 rounded w-14 text-center" />
                        <span className="text-slate-500">perc</span>
                    </div>

                    {lapok.map((nap, ni) => (
                        <div key={ni} className="border-t border-slate-700 pt-2">
                            <div className="text-[11px] font-bold text-emerald-400 mb-1">{nap.nap} — {nap.hely}</div>
                            <div className="flex flex-wrap gap-1">
                                {['A', 'B', 'C'].map(szint => {
                                    const elem = nap.sorrend.find(e => e.csoport && csoportok[e.csoport] && csoportok[e.csoport].szint === szint);
                                    if (!elem) return null;
                                    const jatekido = csoportok[elem.csoport].jatekido;
                                    return (
                                        <div key={szint} className="flex items-center gap-1 bg-slate-900 rounded px-1.5 py-1">
                                            <span className="font-black text-[11px]">{szint}</span>
                                            <input type="number" defaultValue={jatekido}
                                                onBlur={e => meccshosszAllit(ni, szint, parseInt(e.target.value, 10) || 0)}
                                                className="bg-slate-700 w-10 text-center text-[11px] rounded" />
                                            <span className="text-slate-500 text-[10px]">p</span>
                                        </div>
                                    );
                                })}
                                <div className="flex items-center gap-1 bg-slate-900 rounded px-1.5 py-1">
                                    <span className="text-[10px] text-slate-400">zárás</span>
                                    <input type="text" defaultValue={nap.zaroIdo} key={nap.zaroIdo}
                                        onBlur={e => napMezo(ni, 'zaroIdo', e.target.value)}
                                        title="Ameddig a pálya rendelkezésre áll" className="bg-slate-700 w-12 text-center text-[11px] rounded" />
                                </div>
                                <div className="flex items-center gap-1 bg-slate-900 rounded px-1.5 py-1">
                                    <span className="text-[11px]">🧊</span>
                                    <input type="number" defaultValue={15}
                                        onBlur={e => rolbaHosszAllit(ni, parseInt(e.target.value, 10) || 0)}
                                        className="bg-slate-700 w-10 text-center text-[11px] rounded" />
                                    <span className="text-slate-500 text-[10px]">p</span>
                                </div>
                            </div>
                        </div>
                    ))}
                </section>

                <label className={`flex items-center gap-2 px-3 py-2 rounded-lg cursor-pointer text-xs font-bold transition ${szerkesztheto ? 'bg-blue-900/50 text-blue-300 border border-blue-600' : 'bg-slate-800 border border-slate-700'}`}>
                    <input type="checkbox" checked={szerkesztheto} onChange={() => setSzerkesztheto(!szerkesztheto)}
                        className="accent-blue-500" />
                    Sorok szerkesztése a menetrendben
                </label>
                {szerkesztheto && <div className="text-[10px] text-slate-400 -mt-2 px-1 leading-tight">
                    Az idő mezőbe írt érték fix kezdés lesz; üresen hagyva az előző sorból folytatódik. ❄ rolbát szúr be, ✕ töröl.
                </div>}

                {/* Csapatok */}
                <section className="space-y-1.5">
                    <div className="text-slate-400 font-bold text-[11px] flex justify-between">
                        <span>CSAPATOK</span>
                        {kivalasztott && <span className="text-emerald-400">Csere: válaszd ki a párját</span>}
                    </div>
                    {Object.entries(csoportok).map(([k, cs]) => (
                        <CsoportKartya key={k} kulcs={k} csoport={cs} frissit={csoportFrissit}
                            kivalasztott={kivalasztott} setKivalasztott={setKivalasztott} csere={csere}
                            csapatszamAllit={csapatszamAllit} csoportMezo={csoportMezo} csoportTorol={csoportTorol}
                            halvany={!lathatoCsoportok[k]} />
                    ))}
                    <UjCsoport lapok={lapok} hozzaad={csoportHozzaad} />
                    <button onClick={csapatNevekUjra}
                        className="w-full bg-slate-800 hover:bg-slate-700 py-1.5 rounded text-[11px] font-bold border border-slate-700 text-slate-300">
                        ↻ CSAPAT-nevek újragenerálása
                    </button>
                </section>

                <button onClick={visszaallit}
                    className="bg-red-900/60 hover:bg-red-800 py-2 rounded text-xs font-bold border border-red-700">
                    ↺ Vissza a 2025-ös alapsablonra
                </button>
            </div>

            {/* JOBB OLDAL: LAPOK */}
            <div id="lapok" className="flex-1 overflow-y-auto p-6 custom-scrollbar">
                {szeletek.length === 0
                    ? <div className="text-center text-slate-500 py-20 text-sm">
                        A válogatás szerint egyetlen oldal sem jelenik meg. Jelölj be legalább egy lapot és egy szintet.
                      </div>
                    : szeletek.map(({ nap, napIdx, szelet }, si) => (
                        <Lap key={si} nap={nap} szelet={szelet} csoportok={csoportok} szerkesztheto={szerkesztheto}
                            utolsoIdx={napok[napIdx].sorrend.length - 1}
                            napIdx={napIdx}
                            meccsKijelolt={meccsKijelolt}
                            nevreKattint={(si2, s, pi, oi) => nevreKattint(napIdx, si2, s, pi, oi)}
                            cserekTorol={si2 => cserekTorol(napIdx, si2)}
                            palyaNevek={nap.palyaNevek}
                            palyaNevAllit={(i, ertek) => palyaNevAllit(napIdx, i, ertek)}
                            napMezo={(mezo, ertek) => napMezo(napIdx, mezo, ertek)}
                            lapKiurit={() => lapKiurit(napIdx)}
                            sorModosit={(si2, mezo, ertek) => sorModosit(napIdx, si2, mezo, ertek)}
                            sorTorol={si2 => sorTorol(napIdx, si2)}
                            rolbaBeszur={si2 => rolbaBeszur(napIdx, si2)}
                            jegyzetBeszur={si2 => jegyzetBeszur(napIdx, si2)}
                            sorMozgat={(si2, irany) => sorMozgat(napIdx, si2, irany)} />
                    ))}
            </div>
        </div>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<MenetrendApp />);
</script>
</body>
</html>
