<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U12 3x3 Sorsolás Generáló</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Nyomtatási beállítások - Ez garantálja a tökéletes A4 fekvő nézetet */
        @media print {
            @page { size: A4 landscape; margin: 0; }
            body { margin: 0; background-color: white; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .print-hide { display: none !important; }
            #nyomtatasi-terulet {
                width: 297mm !important; height: 210mm !important; margin: 0 !important; padding: 10mm !important;
                box-shadow: none !important; border: none !important; border-radius: 0 !important; transform: scale(1) !important;
                overflow: hidden !important; page-break-after: avoid !important; page-break-inside: avoid !important;
                background-color: white !important; position: relative;
            }
        }
        /* Görgetősáv dizájn a bal oldali menühöz */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    </style>
</head>
<body class="bg-slate-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        const SorsolasApp = () => {

            // --- 1. BLOKK: ADATBÁZISOK ÉS LOGÓK ---
            const rejtettTestverek = [
                ["UTE", "MEGYERI"],
                ["NYÍR", "SZAB"],   
                ["NYE", "SZP"]
            ];

            const csarnokAdatbazis = [
                { kulcsszavak: ["ANGELS", "BALATONBOGLÁR", "JÉGKERT", "BUDAKALÁSZ", "CSABAI", "PAJTA", "DUNAKESZI", "MAKÓ", "DUOCOR", "ESZTERGOM", "KISPÁLYA", "HALÁSZTELEK", "KAZINCBARCIKA", "KECSKEMÉT", "KŐBÁNYA", "LŐRINCI", "MOSONMAGYARÓVÁR", "PÉCS", "SOPRON", "SZOLNOK", "TATA", "VÁROSGAZDA"], kapacitas: 1 },
                { kulcsszavak: ["EGER", "SZARVAS", "TÁT", "VÁRPALOTA"], kapacitas: 2 }
            ];

            const csarnokNevekLista = [
                "Ajka Jégcsarnok", "Budai Jégpálya (Jégkert)", "Dunaújvárosi Jégcsarnok", "Érdi Jégcsarnok", 
                "Ifj. Ocskay Gábor Jégcsarnok, B pálya", "Ifj. Ocskay Gábor Jégcsarnok, C pálya", 
                "Miskolci Jégcsarnok", "Tüskesátor", "Vasas Jégcentrum, Centerpálya", "Vasas Jégcentrum, Edzőpálya"
            ];

            const csapatNevekLista = [
                "Ajkai Óriások", "B-Villámok SE", "Dunaújvárosi Acélbikák", "Gödöllői Muskétások", 
                "HC Kiskőrös", "Jégkert SE", "KESI", "MAC Budapest A", "Pécsi Sakálok", 
                "Szombathelyi Pingvinek", "UTE", "Vasas SC", "White Sharks HC"
            ];

            const areSameClub = (teamA, teamB) => {
                if (!teamA || !teamB) return false;
                let a = teamA.trim().toUpperCase();
                let b = teamB.trim().toUpperCase();
                if (a === 'SZABAD' || b === 'SZABAD' || a === '' || b === '') return false;
                
                const clean = (s) => s.replace(/(\s*\d+|\s+[A-Z]\d*|\s+II|\s+III|\s+IV)$/i, '').trim();
                let cleanA = clean(a);
                let cleanB = clean(b);
                
                if (cleanA === cleanB && cleanA.length > 2) return true;
                
                for (let pair of rejtettTestverek) {
                    const upperPair = pair.map(p => p.toUpperCase());
                    if ((upperPair.includes(cleanA) && upperPair.includes(cleanB)) ||
                        (upperPair.includes(a) && upperPair.includes(b))) {
                        return true;
                    }
                }
                return false;
            };

            const formatDatum = (dateStr) => {
                if (!dateStr) return '';
                const dateObj = new Date(dateStr);
                if (isNaN(dateObj)) return dateStr;
                return `${dateObj.getFullYear()}.${String(dateObj.getMonth() + 1).padStart(2, '0')}.${String(dateObj.getDate()).padStart(2, '0')}.`;
            };

            // --- 2. BLOKK: ÁLLAPOTOK ÉS LOGIKA ---
            const [tornaAdatok, setTornaAdatok] = useState({
                korosztaly: 'U12 3x3', csoport: '',
                szint: '4cs_4m_2p_side', sorszam: '',
                datum: '', kezdes: '',
                rendezo: '', helyszin: '',
                info: '', infoSzin: '#dc2626', palyaTipus: '2_palya',
                egyediMeccsPerc: '40', // U12-nél általában hosszabb egy blokk
                egyediSzunetPerc: '10' // Rolba alapértelmezett
            });

            const [csapatok, setCsapatok] = useState(['', '', '', '', '', '', '', '']);
            const [csapatSzinek, setCsapatSzinek] = useState(Array(8).fill('#1e293b')); 
            const [pastedData, setPastedData] = useState(''); 
            const [utkozesEngedelyezve, setUtkozesEngedelyezve] = useState(false); 
            const fileInputRef = useRef(null);
            
            const [kivalasztottCsapat, setKivalasztottCsapat] = useState(null);
            const [manualOverrides, setManualOverrides] = useState({});
            const [isJSONLoading, setIsJSONLoading] = useState(false);

            const cleanFileName = (text) => {
                const ekezetek = {'á':'a','é':'e','í':'i','ó':'o','ö':'o','ő':'o','ú':'u','ü':'u','ű':'u','Á':'A','É':'E','Í':'I','Ó':'O','Ö':'O','Ő':'O','Ú':'U','Ü':'U','Ű':'U'};
                let clean = text.split('').map(char => ekezetek[char] || char).join('');
                return clean.replace(/[^a-z0-9]/gi, '_').replace(/_+/g, '_').replace(/^_|_$/g, '');
            };

            // Varázsdoboz beolvasó rutin (egyszerűsítve)
            const handleExcelPaste = (e) => {
                const text = e.target.value;
                if (!text) return;
                let ujAdatok = { ...tornaAdatok, info: '' }; 
                let ujCsapatok = ['', '', '', '', '', '', '', ''];
                let talaltCsapatokSzama = 0;

                setUtkozesEngedelyezve(false); 
                setKivalasztottCsapat(null);
                setManualOverrides({});

                const rawLines = text.split('\n').map(l => l.trim()).filter(l => l !== '');
                if (rawLines.length === 0) return;
                
                // Egyszerű adatkivétel
                for (let i = 0; i < rawLines.length; i++) {
                    const line = rawLines[i];
                    if (line.match(/\b(U12)\b/i)) ujAdatok.korosztaly = 'U12 3x3';
                    if (line.match(/(\d{4})\.(\d{2})\.(\d{2})/)) ujAdatok.datum = line.match(/(\d{4})\.(\d{2})\.(\d{2})/)[0].replace(/\./g, '-');
                    if (line.match(/^(\d{1,2}):(\d{2})$/)) ujAdatok.kezdes = line.match(/^(\d{1,2}):(\d{2})$/)[0];
                    
                    const teamMatch = line.match(/^\d{1,2}[\.\)]\s*(.+)$/);
                    if (teamMatch && talaltCsapatokSzama < 8) { 
                        const tName = teamMatch[1].split('\t')[0].trim();
                        ujCsapatok[talaltCsapatokSzama] = tName; 
                        talaltCsapatokSzama++; 
                    }
                }
                setTornaAdatok(ujAdatok);
                setCsapatok(ujCsapatok);
                setTimeout(() => setPastedData(''), 100);
            };

            const handleSaveJSON = () => {
                const dataToSave = { tornaAdatok, csapatok, csapatSzinek, manualOverrides };
                const blob = new Blob([JSON.stringify(dataToSave, null, 2)], { type: "application/json;charset=utf-8" });
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob); 
                a.download = `${cleanFileName(tornaAdatok.sorszam || '3x3_torna')}.json`; 
                a.click();
            };

            const handleLoadJSON = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        setIsJSONLoading(true);
                        if (data.csapatok) setCsapatok(data.csapatok);
                        if (data.tornaAdatok) setTornaAdatok(data.tornaAdatok);
                        setTimeout(() => { if (data.manualOverrides) setManualOverrides(data.manualOverrides); setIsJSONLoading(false); }, 150);
                    } catch (err) { alert("Hiba a fájl beolvasásakor!"); }
                };
                reader.readAsText(file); e.target.value = null;
            };

            const handleSmartPrint = () => window.print();

            const handleTeamClick = (index) => {
                if (kivalasztottCsapat === null) setKivalasztottCsapat(index);
                else {
                    if (kivalasztottCsapat !== index) {
                        const ujCsapatok = [...csapatok];
                        const temp = ujCsapatok[kivalasztottCsapat];
                        ujCsapatok[kivalasztottCsapat] = ujCsapatok[index];
                        ujCsapatok[index] = temp;
                        setCsapatok(ujCsapatok);
                        setManualOverrides({});
                    }
                    setKivalasztottCsapat(null);
                }
            };

            const handleTableTeamClick = (rink, rowIndex, side) => {
                if (kivalasztottCsapat !== null) {
                    setManualOverrides(prev => ({ ...prev, [`${rink}-${rowIndex}-${side}`]: kivalasztottCsapat }));
                    setKivalasztottCsapat(null);
                }
            };

            // SABLONOK
            const sablonAdatbazis = {
                '4cs_4m_1p': [{ meccsek: [{h:0,v:1}] }, { kor: 'ROLBA' }, { meccsek: [{h:2,v:3}] }, { kor: 'ROLBA' }, { meccsek: [{h:0,v:2}] }, { kor: 'ROLBA' }, { meccsek: [{h:1,v:3}] }, { kor: 'ZARAS' }],
                '4cs_4m_2p_side': [{ meccsek: [{h:0,v:1}, {h:2,v:3}] }, { kor: 'ROLBA' }, { meccsek: [{h:0,v:2}, {h:1,v:3}] }, { kor: 'ROLBA' }, { meccsek: [{h:0,v:3}, {h:1,v:2}] }, { kor: 'ZARAS' }]
            };

            const meccsPerc = tornaAdatok.egyediMeccsPerc ? parseInt(tornaAdatok.egyediMeccsPerc, 10) : 40;
            const rolbaPerc = tornaAdatok.egyediSzunetPerc ? parseInt(tornaAdatok.egyediSzunetPerc, 10) : 10; 
            const bemelegitesPerc = 5;

            const msz = useMemo(() => sablonAdatbazis[tornaAdatok.szint] || sablonAdatbazis['4cs_4m_2p_side'], [tornaAdatok.szint]);
            const palyakSzama = useMemo(() => {
                if (!msz || !msz[0].meccsek) return 1;
                let max = 1; msz.forEach(s => { if (s.meccsek && s.meccsek.length > max) max = s.meccsek.length; });
                return max;
            }, [msz]);

            const palyaBetuk = ["A", "B", "C", "D"];

            const getIdopont = (korIndex, isBemelegites = false) => {
                let korokSzama = 0; let rolbakSzama = 0;
                for(let i=0; i<korIndex; i++) { if(msz[i].kor === 'ROLBA') rolbakSzama++; else if (msz[i].kor !== 'ZARAS') korokSzama++; }
                let [ora, perc] = (tornaAdatok.kezdes || '00:00').split(':').map(Number);
                let ossz = ora * 60 + perc + (korokSzama * meccsPerc) + (rolbakSzama * rolbaPerc) + bemelegitesPerc;
                
                if (isBemelegites && korIndex === 0) {
                    ossz -= bemelegitesPerc; 
                }

                return `${Math.floor(ossz / 60)}:${(ossz % 60).toString().padStart(2, '0')}`;
            };

            const rinkSchedules = useMemo(() => {
                const s = {};
                Array.from({ length: palyakSzama }).forEach((_, i) => { s[palyaBetuk[i]] = []; });
                if (msz) {
                    msz.forEach((sor, idx) => {
                        const ido = getIdopont(idx);
                        if (sor.kor === 'ROLBA') { Object.keys(s).forEach(k => s[k].push({ tipus: 'rolba', ido })); }
                        else if (sor.kor === 'ZARAS') { Object.keys(s).forEach(k => s[k].push({ tipus: 'zaras', ido })); }
                        else {
                            Array.from({ length: palyakSzama }).forEach((_, pIdx) => {
                                const rinkLetter = palyaBetuk[pIdx];
                                const meccs = sor.meccsek[pIdx];
                                if (meccs) s[rinkLetter].push({ tipus: 'meccs', ido, h: meccs.h, v: meccs.v });
                                else s[rinkLetter].push({ tipus: 'szabad', ido });
                            });
                        }
                    });
                }
                return s;
            }, [msz, palyakSzama, tornaAdatok.kezdes, meccsPerc, rolbaPerc, tornaAdatok.szint]);

            const isInvalidTeam = (nev) => !nev || nev.toUpperCase() === 'SZABAD';

            return (
                <div className="flex flex-col md:flex-row h-screen font-sans overflow-hidden bg-slate-200">
                    
                    {/* --- 3. BLOKK: BAL OLDAL (VEZÉRLŐPULT) --- */}
                    <div className="w-full md:w-96 bg-slate-900 text-white p-5 overflow-y-auto shadow-2xl z-20 print-hide h-full shrink-0 flex flex-col gap-4 custom-scrollbar">
                        
                        <h2 className="text-xl font-black text-red-500 border-b border-slate-700 pb-3 flex justify-between items-center">
                            3x3 SORSOLÁS v1.0
                            <label className={`flex items-center gap-1.5 text-[10px] uppercase font-bold cursor-pointer px-2 py-1.5 rounded transition ${utkozesEngedelyezve ? 'bg-green-900/40 text-green-400' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}>
                                <input type="checkbox" checked={utkozesEngedelyezve} onChange={() => setUtkozesEngedelyezve(!utkozesEngedelyezve)} className="accent-green-500 w-3 h-3"/>
                                Testvérharc OK
                            </label>
                        </h2>

                        {/* NAVIGÁCIÓS GOMBOK */}
                        <div className="flex flex-col gap-2">
                            <a href="index.html" className="w-full bg-blue-700 hover:bg-blue-600 text-white text-center font-bold py-2 rounded-lg shadow-md transition-all text-xs uppercase tracking-widest">
                                🏒 Jégkorong
                            </a>
                            <a href="inline.html" className="w-full bg-orange-600 hover:bg-orange-500 text-white text-center font-bold py-2 rounded-lg shadow-md transition-all text-xs uppercase tracking-widest">
                                🛼 Inline
                            </a>
                            <a href="3x3.html" className="w-full bg-red-700 hover:bg-red-600 text-white text-center font-bold py-2 rounded-lg shadow-md transition-all text-xs uppercase tracking-widest ring-2 ring-white">
                                🥅 U12 3x3
                            </a>
                        </div>

                        <div className="bg-yellow-900/30 border border-yellow-600/50 rounded-lg p-3">
                            <label className="block text-yellow-500 uppercase font-black mb-2 tracking-widest text-[10px]">🪄 Varázsdoboz (Beolvasás)</label>
                            <textarea value={pastedData} onChange={handleExcelPaste} placeholder="Másold be ide a tornát..." className="w-full bg-slate-800/80 p-2 rounded border border-slate-600 text-slate-200 text-sm h-20 focus:outline-none focus:border-yellow-500"/>
                        </div>

                        <div className="space-y-4 text-sm">
                            <section className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                                <label className="block text-slate-400 uppercase font-bold mb-3 text-xs">Alapbeállítások</label>
                                
                                <div className="grid grid-cols-2 gap-2 mb-3">
                                    <input type="text" value={tornaAdatok.korosztaly} onChange={e => setTornaAdatok({...tornaAdatok, korosztaly: e.target.value})} className="bg-slate-700 p-2 rounded font-bold text-sm outline-none text-center" placeholder="Korosztály (pl. U12 3x3)" />
                                    <input type="time" value={tornaAdatok.kezdes} onChange={e => setTornaAdatok({...tornaAdatok, kezdes: e.target.value})} className={`p-2 rounded border font-bold text-center text-sm ${!tornaAdatok.kezdes ? 'bg-red-900/80 border-red-500' : 'bg-slate-700 border-slate-600'}`}/>
                                </div>
                                
                                <div className="flex gap-2">
                                    <select value={tornaAdatok.szint} onChange={e => setTornaAdatok({...tornaAdatok, szint: e.target.value})} className="w-full p-2 rounded text-sm font-bold border border-slate-600 bg-slate-700 outline-none">
                                        <option value="4cs_4m_1p">4 Csapat / 1 Pálya (Egymás alatt)</option>
                                        <option value="4cs_4m_2p_side">4 Csapat / 2 Pálya (Egymás mellett)</option>
                                    </select>
                                    <input type="number" placeholder="Meccs" className="w-16 bg-slate-700 text-white p-2 rounded text-sm font-bold border border-slate-600 text-center" value={tornaAdatok.egyediMeccsPerc} onChange={(e) => setTornaAdatok({ ...tornaAdatok, egyediMeccsPerc: e.target.value })} title="Meccs (perc)"/>
                                    <input type="number" placeholder="Rolba" className="w-16 bg-slate-700 text-white p-2 rounded text-sm font-bold border border-slate-600 text-center" value={tornaAdatok.egyediSzunetPerc} onChange={(e) => setTornaAdatok({ ...tornaAdatok, egyediSzunetPerc: e.target.value })} title="Rolba (perc)"/>
                                </div>
                            </section>

                            <section className="space-y-3">
                                <input type="text" value={tornaAdatok.sorszam} onChange={e => setTornaAdatok({...tornaAdatok, sorszam: e.target.value})} className="w-full bg-slate-800 p-2.5 rounded border border-slate-700 font-bold text-sm" placeholder="Torna sorszáma / neve (pl. Dunaújvárosi Acélbikák (Baja))"/>
                                <input type="date" value={tornaAdatok.datum} onChange={e => setTornaAdatok({...tornaAdatok, datum: e.target.value})} className="w-full bg-slate-800 p-2.5 rounded border border-slate-700 text-white text-sm font-bold"/>
                                <input type="text" list="helyszin-lista" value={tornaAdatok.helyszin} onChange={e => setTornaAdatok({...tornaAdatok, helyszin: e.target.value})} className="w-full bg-slate-800 p-2.5 rounded border border-slate-700 text-sm" placeholder="Helyszín neve (pl. Budai Jégpálya)"/>
                                <datalist id="helyszin-lista">{csarnokNevekLista.map(nev => <option key={nev} value={nev} />)}</datalist>
                                <datalist id="csapat-lista">{csapatNevekLista.map(nev => <option key={nev} value={nev} />)}</datalist>
                            </section>

                            <section className="pt-4 border-t border-slate-700">
                                <label className="block text-slate-400 uppercase font-bold mb-3 text-xs">Résztvevő Csapatok</label>
                                {csapatok.map((cs, i) => {
                                    const maxCsapat = parseInt(tornaAdatok.szint.match(/^\d+/)?.[0] || 8);
                                    const isNeeded = i < maxCsapat;
                                    const isSelectedForSwap = kivalasztottCsapat === i;

                                    return (
                                        <div key={i} className={`flex items-center gap-2 mb-2 ${!isNeeded ? 'opacity-30' : ''}`}>
                                            <span className="w-5 text-center text-slate-500 font-black text-sm">{i+1}</span>
                                            <input type="text" list="csapat-lista" value={cs} onChange={e => {const n = [...csapatok]; n[i] = e.target.value; setCsapatok(n);}} onClick={() => isNeeded && handleTeamClick(i)} readOnly={isSelectedForSwap} className={`flex-grow p-2 rounded border text-sm font-bold transition-all cursor-pointer ${isSelectedForSwap ? 'bg-green-900/40 border-green-500 ring-2 ring-green-500' : 'bg-slate-800 border-slate-700 focus:border-blue-500'}`} placeholder={`Csapat ${i+1}`} disabled={!isNeeded} />
                                        </div>
                                    )
                                })}
                            </section>

                            <div className="flex gap-2 pt-2">
                                <button onClick={handleSaveJSON} className="flex-1 bg-emerald-700 hover:bg-emerald-600 text-white font-bold py-2.5 rounded shadow text-xs tracking-wider flex justify-center items-center">💾 MENTÉS</button>
                                <input type="file" accept=".json" onChange={handleLoadJSON} ref={fileInputRef} className="hidden" />
                                <button onClick={() => fileInputRef.current.click()} className="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-2.5 rounded shadow text-xs tracking-wider flex justify-center items-center">📂 BETÖLTÉS</button>
                            </div>

                            <button onClick={handleSmartPrint} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-3 rounded-lg shadow-lg text-sm print-hide">PDF MENTÉSE</button>
                        </div>
                    </div>

                    {/* --- 4. BLOKK: JOBB OLDAL (U12 3x3 DESIGN) --- */}
                    <div className="flex-grow overflow-auto flex flex-col items-center p-4 bg-slate-500 print:p-0 print:bg-white custom-scrollbar">
                        <div id="nyomtatasi-terulet" className="bg-white w-[297mm] h-[210mm] relative shrink-0 overflow-hidden text-black font-sans flex flex-col items-center">
                            
                            {/* Felső 3x3 Logó */}
                            <div className="w-full h-[60mm] flex justify-center items-center mt-2 mb-2">
                                {/* Helyezd el a mappában a '3x3_logo.png' fájlt! */}
                                <img src="Csapat_logok/U12_3x3_LOGO.png" alt="3x3 Logo" className="h-full object-contain" onError={(e) => { e.target.style.display = 'none'; }} />
                            </div>

                            {/* Táblázat konténer */}
                            <div className="w-[280mm] border-[2px] border-[#0a0a5c] flex flex-col shadow-sm">
                                
                                {/* Fő fejléc */}
                                <div className="bg-[#0a0a5c] text-white font-bold text-center py-2 text-[18px]">
                                    {tornaAdatok.datum ? `${formatDatum(tornaAdatok.datum)} ` : ''}{tornaAdatok.korosztaly} {tornaAdatok.sorszam ? `- ${tornaAdatok.sorszam}` : ''} {tornaAdatok.helyszin ? `(${tornaAdatok.helyszin})` : ''}
                                </div>

                                {/* Oszlop fejlécek */}
                                <div className="flex bg-[#0a0a5c] text-white font-bold text-center border-t-[1px] border-[#0a0a5c]">
                                    <div className="w-[18mm] border-r-[1px] border-[#0a0a5c]"></div>
                                    {palyaBetuk.slice(0, palyakSzama).map(rink => (
                                        <div key={rink} className="flex-1 py-1.5 border-l-[1px] border-[#1e1e80]">
                                            {rink} pálya {rink === 'A' ? <span className="font-normal">(rolba bejáró)</span> : ''}
                                        </div>
                                    ))}
                                </div>

                                {/* Bemelegítés Sáv (PIROS) */}
                                <div className="flex items-stretch border-t-[1px] border-[#0a0a5c]">
                                    <div className="w-[18mm] bg-[#0a0a5c] text-white font-bold flex justify-center items-center py-1.5 border-r-[1px] border-[#0a0a5c]">
                                        {getIdopont(0, true)}
                                    </div>
                                    <div className="flex-1 bg-[#cc0000] text-white font-bold uppercase flex justify-center items-center tracking-wider text-[16px]">
                                        Bemelegítés {bemelegitesPerc} PERC
                                    </div>
                                </div>

                                {/* Meccsek és Szünetek Sorai */}
                                {msz.map((row, i) => {
                                    const ido = getIdopont(i);
                                    
                                    if (row.kor === 'ROLBA') {
                                        return (
                                            <div key={i} className="flex items-stretch border-t-[1px] border-gray-400">
                                                <div className="w-[18mm] bg-[#0a0a5c] text-white font-bold flex justify-center items-center py-1.5 border-r-[1px] border-[#0a0a5c]">
                                                    {ido}
                                                </div>
                                                <div className="flex-1 bg-[#d1d5db] text-black font-bold flex justify-center items-center">
                                                    Rolba
                                                </div>
                                            </div>
                                        );
                                    }

                                    if (row.kor === 'ZARAS') {
                                        return (
                                            <div key={i} className="flex items-stretch border-t-[1px] border-[#0a0a5c]">
                                                <div className="w-[18mm] bg-[#0a0a5c] text-white font-bold flex justify-center items-center py-1.5 border-r-[1px] border-[#0a0a5c]"></div>
                                                <div className="flex-1 bg-[#0a0a5c] text-white font-bold flex justify-center items-center py-1.5">
                                                    Torna vége
                                                </div>
                                            </div>
                                        );
                                    }

                                    return (
                                        <div key={i} className="flex items-stretch border-t-[1px] border-gray-400 bg-white min-h-[10mm]">
                                            <div className="w-[18mm] bg-[#0a0a5c] text-white font-bold flex justify-center items-center py-1.5 border-r-[1px] border-[#0a0a5c]">
                                                {ido}
                                            </div>
                                            
                                            {palyaBetuk.slice(0, palyakSzama).map(rink => {
                                                const meccs = row.meccsek[palyaBetuk.indexOf(rink)];
                                                if (!meccs) return <div key={rink} className="flex-1 border-l-[1px] border-gray-400"></div>;

                                                const valosH = csapatok[manualOverrides[`${rink}-${i}-h`] ?? meccs.h];
                                                const valosV = csapatok[manualOverrides[`${rink}-${i}-v`] ?? meccs.v];
                                                const isTestver = !utkozesEngedelyezve && areSameClub(valosH, valosV);

                                                return (
                                                    <div key={rink} className={`flex-1 flex border-l-[1px] border-gray-400 ${isTestver ? 'bg-yellow-200' : ''}`}>
                                                        <div className="flex-1 flex justify-center items-center text-center p-1 text-[15px] cursor-pointer hover:bg-blue-100" onClick={() => handleTableTeamClick(rink, i, 'h')}>
                                                            {isInvalidTeam(valosH) ? '' : valosH}
                                                        </div>
                                                        <div className="w-[8mm] flex justify-center items-center border-l-[1px] border-r-[1px] border-gray-400 font-bold text-gray-500">
                                                            —
                                                        </div>
                                                        <div className="flex-1 flex justify-center items-center text-center p-1 text-[15px] cursor-pointer hover:bg-blue-100" onClick={() => handleTableTeamClick(rink, i, 'v')}>
                                                            {isInvalidTeam(valosV) ? '' : valosV}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    );
                                })}

                            </div>
                        </div>
                    </div>
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SorsolasApp />);
    </script>
</body>
</html>
